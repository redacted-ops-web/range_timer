name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Stage web files
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js icons fonts www/

      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      - name: Set launcher icon
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/*.xml
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d legacy fg <<< "$pair"
            convert icons/icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RangeTimer.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" RangeTimer.apk --title "Range Timer $TAG" --notes "Sideloadable APK" --repo "${{ github.repository }}"
