name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Stage web files
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js icons fonts www/

      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      - name: Set launcher icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          res = "android/app/src/main/res"
          for f in glob.glob(res + "/mipmap-anydpi-v26/*.xml"):
              os.remove(f)
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          src = Image.open("icons/icon-512.png").convert("RGBA")
          for d, px in sizes.items():
              img = src.resize((px, px), Image.LANCZOS)
              img.save(f"{res}/mipmap-{d}/ic_launcher.png")
              img.save(f"{res}/mipmap-{d}/ic_launcher_round.png")
              fg = f"{res}/mipmap-{d}/ic_launcher_foreground.png"
              if os.path.exists(fg):
                  os.remove(fg)
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RangeTimer.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" RangeTimer.apk --title "Range Timer $TAG" --notes "Sideloadable APK" --repo "${{ github.repository }}"
